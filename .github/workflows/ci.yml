name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python テスト（drift_diffusion）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  server:
    name: サーバー（構文チェック・起動確認）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: 構文チェック
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: 起動確認
        run: |
          node index.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/api/meetings || true)
            if [ "$code" != "000" ]; then echo "HTTP $code"; exit 0; fi
            sleep 1
          done
          echo "サーバーが起動しませんでした"; cat server.log; exit 1

  frontend:
    name: フロントエンド（ビルド）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
